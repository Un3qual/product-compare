schema {
  mutation: RootMutationType
  query: RootQueryType
}

type MutationError {
  code: String!
  message: String!
  field: String
}

type SeoMetadata {
  title: String!
  description: String!
  canonicalPath: String!
  indexable: Boolean!
  imageUrl: String
  structuredData: String
}

interface Node {
  "The ID of the object."
  id: ID!
}

type RootQueryType {
  "Returns the current authenticated user, if any."
  viewer: User

  "Returns API tokens owned by the current authenticated user."
  myApiTokens(after: String, first: Int!, status: ApiTokenStatusFilter): ApiTokenConnection!

  "Returns active coupons for a merchant at a specific timestamp (or now by default)."
  activeCoupons(after: String, first: Int!, merchantId: ID!, at: DateTime): CouponConnection

  "Returns price watches owned by the current authenticated user."
  myPriceWatches(after: String, first: Int!, enabled: Boolean): PriceWatchConnection!

  "Returns in-app price alert events owned by the current user."
  myAlertEvents(after: String, first: Int!, unreadOnly: Boolean): AlertEventConnection!

  "Returns a single product by slug."
  product(slug: String!): Product

  "Returns one product or null for each requested comparison slug, in requested order."
  comparisonProducts(slugs: [String!]!): [Product]!

  "Returns deterministic source-backed guidance for two or three products."
  comparisonRecommendation(slugs: [String!]!, profile: RecommendationProfile!): ComparisonRecommendation!

  "Returns products in a deterministic requested order with cursor pagination."
  products(after: String, first: Int!, filters: ProductFiltersInput): ProductConnection

  "Returns display-safe metadata for product filter controls."
  productFilterMetadata(filters: ProductFiltersInput): ProductFilterMetadata!

  "Returns the current authenticated user's saved comparison sets."
  mySavedComparisonSets(after: String, first: Int!): SavedComparisonSetConnection

  "Returns the secret-safe CJ commission ingestion state for operators."
  cjCommissionIngestion: CJCommissionIngestion!

  "Returns CJ commission sync run history for operators."
  cjCommissionSyncRuns(after: String, first: Int!): CJCommissionSyncRunConnection!

  "Returns individual commerce attribution clicks for operators."
  commerceAttributionClicks(after: String, first: Int!, input: RevenueSummaryInput): CommerceAttributionClickConnection!

  "Returns aggregate commerce revenue metrics for operators."
  revenueSummary(input: RevenueSummaryInput): RevenueSummary

  "Returns a published, non-revoked immutable comparison snapshot."
  comparisonSnapshot(token: String!): ComparisonSnapshot

  "Returns a published product question by global ID."
  productQuestion(id: ID!): ProductQuestion

  "Returns CJ advertiser programs for lifecycle management."
  cjPrograms(after: String, first: Int!, stage: CJProgramStage, sort: CJProgramSort): CJProgramConnection!

  "Returns one CJ advertiser program by its opaque lifecycle ID."
  cjProgram(id: ID!): CJProgram

  "Returns lifecycle counts across all CJ advertiser programs."
  cjProgramStageCounts: CJProgramStageCounts!

  "Returns CJ feeds that cannot be associated with an advertiser program."
  unmatchedCjFeeds(after: String, first: Int!): MerchantFeedCandidateConnection!

  "Returns the essential public homepage workspace."
  homeWorkspace(selectedSlugs: [String!]!): HomeWorkspace!

  "Returns independent public and viewer-scoped homepage deals."
  homeDeals(selectedSlugs: [String!]!): HomeDeals!

  "Returns merchants ordered by primary key with cursor pagination."
  merchants(after: String, first: Int!): MerchantConnection

  "Returns one merchant by canonical slug."
  merchant(slug: String!): Merchant

  "Returns merchant products for a product with optional merchant and active filters."
  merchantProducts(after: String, first: Int!, input: MerchantProductsInput!): MerchantProductConnection

  "Returns a curated public product category by canonical search slug."
  category(slug: String!): SeoCategory

  "Returns safe display metadata for a source artifact."
  sourceArtifact(id: ID!): SourceArtifact

  "Returns specification corrections submitted by the current user."
  mySpecificationCorrections(after: String, first: Int!, status: SpecificationCorrectionStatus): SpecificationCorrectionConnection!

  "Returns the operator-only specification correction moderation queue."
  specificationCorrectionModerationQueue(after: String, first: Int!, status: SpecificationCorrectionStatus): SpecificationCorrectionConnection!

  "Returns a supported node by global ID."
  node(
    "The ID of an object."
    id: ID!
  ): Node
}

type RootMutationType {
  "Creates a new user session by registering an email\/password account."
  register(email: String!, password: String!): AuthSessionPayload!

  "Creates a new user session from email\/password credentials."
  login(email: String!, password: String!): AuthSessionPayload!

  "Deletes the current browser session."
  logout: LogoutPayload!

  "Requests a password reset email for an existing account."
  forgotPassword(email: String!): AuthActionPayload!

  "Resets an account password using a previously issued reset token."
  resetPassword(token: String!, password: String!): AuthActionPayload!

  "Confirms an account email using a previously issued verification token."
  verifyEmail(token: String!): AuthActionPayload!

  "Creates a new API token for the current authenticated user."
  createApiToken(label: String, expiresAt: DateTime): CreateApiTokenPayload!

  "Revokes one of the current authenticated user's API tokens."
  revokeApiToken(tokenId: ID!): RevokeApiTokenPayload!

  "Rotates one of the current authenticated user's API tokens."
  rotateApiToken(tokenId: ID!, label: String, expiresAt: DateTime): CreateApiTokenPayload!

  "Upserts an affiliate network by name."
  upsertAffiliateNetwork(input: UpsertAffiliateNetworkInput!): UpsertAffiliateNetworkPayload

  "Upserts an affiliate program by affiliate network and merchant."
  upsertAffiliateProgram(input: UpsertAffiliateProgramInput!): UpsertAffiliateProgramPayload

  "Upserts an affiliate link by merchant product."
  upsertAffiliateLink(input: UpsertAffiliateLinkInput!): UpsertAffiliateLinkPayload

  "Creates a coupon for a merchant."
  createCoupon(input: CreateCouponInput!): CreateCouponPayload

  "Creates a product or offer price watch for the current user."
  createPriceWatch(input: CreatePriceWatchInput!): PriceWatchPayload!

  "Updates one of the current user's price watches."
  updatePriceWatch(input: UpdatePriceWatchInput!): PriceWatchPayload!

  "Deletes one of the current user's price watches."
  deletePriceWatch(id: ID!): DeletePriceWatchPayload!

  "Marks one of the current user's in-app alert events as read."
  markAlertRead(id: ID!): AlertEventPayload!

  "Creates a private saved comparison set for the current authenticated user."
  createSavedComparisonSet(input: CreateSavedComparisonSetInput!): SavedComparisonSetPayload!

  "Deletes one of the current authenticated user's saved comparison sets."
  deleteSavedComparisonSet(savedComparisonSetId: ID!): SavedComparisonSetPayload!

  "Updates editable CJ commission ingestion settings as an operator."
  updateCjCommissionIngestionSettings(input: UpdateCJCommissionIngestionSettingsInput!): CJCommissionIngestionPayload!

  "Queues CJ commission ingestion immediately as an operator."
  runCjCommissionIngestionNow: CJCommissionIngestionPayload!

  "Creates a first-party tracked outbound commerce click."
  trackCommerceClick(input: TrackCommerceClickInput!): TrackCommerceClickPayload!

  "Publishes an immutable comparison snapshot for the current user."
  publishComparisonSnapshot(input: PublishComparisonSnapshotInput!): PublishComparisonSnapshotPayload!

  "Revokes one of the current user's public comparison snapshots."
  revokeComparisonSnapshot(snapshotId: ID!): RevokeComparisonSnapshotPayload!

  "Submits one authenticated product review for moderation."
  submitProductReview(input: SubmitProductReviewInput!): ProductReviewPayload!

  "Submits an authenticated product question for moderation."
  askProductQuestion(input: AskProductQuestionInput!): ProductQuestionPayload!

  "Submits an authenticated answer to a published question."
  answerProductQuestion(input: AnswerProductQuestionInput!): ProductAnswerPayload!

  "Updates one review owned by the current user and resubmits it for moderation."
  updateProductReview(input: UpdateProductReviewInput!): ProductReviewPayload!

  "Updates one question owned by the current user and resubmits it for moderation."
  updateProductQuestion(input: UpdateProductQuestionInput!): ProductQuestionPayload!

  "Updates one answer owned by the current user and resubmits it for moderation."
  updateProductAnswer(input: UpdateProductAnswerInput!): ProductAnswerPayload!

  "Soft-removes review or Q&A content owned by the current user."
  removeCommunityContent(input: RemoveCommunityContentInput!): RemoveCommunityContentPayload!

  "Marks one published answer as accepted by the question owner."
  acceptProductAnswer(questionId: ID!, answerId: ID!): ProductQuestionPayload!

  "Reports review or Q&A content for operator moderation."
  reportCommunityContent(input: ReportCommunityContentInput!): CommunityReportPayload!

  "Publishes, hides, or rejects community content as an operator."
  moderateCommunityContent(input: ModerateCommunityContentInput!): CommunityModerationPayload!

  "Updates the lifecycle state and optional note for one CJ advertiser program."
  updateCjProgram(input: UpdateCjProgramInput!): UpdateCjProgramPayload!

  "Proposes an authenticated, typed replacement for a product specification."
  proposeSpecificationCorrection(input: ProposeSpecificationCorrectionInput!): SpecificationCorrectionPayload!

  "Accepts or rejects a specification correction as an operator."
  moderateSpecificationCorrection(input: ModerateSpecificationCorrectionInput!): SpecificationCorrectionPayload!
}

