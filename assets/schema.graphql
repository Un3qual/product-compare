schema {
  query: Query
  mutation: Mutation
}

interface Node {
  id: ID!
}

type Query {
  viewer: User
  node(id: ID!): Node
  sourceArtifact(id: ID!): SourceArtifact
  product(slug: String!): Product
  products(first: Int, after: String, filters: ProductFiltersInput): ProductConnection!
  merchants(first: Int, after: String): MerchantConnection
  merchantProducts(input: MerchantProductsInput!): MerchantProductConnection!
  mySavedComparisonSets(first: Int, after: String): SavedComparisonSetConnection!
  myApiTokens(first: Int, after: String, status: ApiTokenStatusFilter): ApiTokenConnection!
  revenueSummary(input: RevenueSummaryInput): RevenueSummary
}

type Mutation {
  login(email: String!, password: String!): AuthSessionPayload!
  register(email: String!, password: String!): AuthSessionPayload!
  logout: LogoutPayload!
  forgotPassword(email: String!): AuthActionPayload!
  resetPassword(token: String!, password: String!): AuthActionPayload!
  verifyEmail(token: String!): AuthActionPayload!
  createSavedComparisonSet(input: CreateSavedComparisonSetInput!): CreateSavedComparisonSetPayload!
  deleteSavedComparisonSet(savedComparisonSetId: ID!): DeleteSavedComparisonSetPayload!
  createApiToken(label: String, expiresAt: DateTime): CreateApiTokenPayload!
  revokeApiToken(tokenId: ID!): RevokeApiTokenPayload!
  rotateApiToken(tokenId: ID!, label: String, expiresAt: DateTime): CreateApiTokenPayload!
  upsertAffiliateNetwork(input: UpsertAffiliateNetworkInput!): UpsertAffiliateNetworkPayload
  upsertAffiliateProgram(input: UpsertAffiliateProgramInput!): UpsertAffiliateProgramPayload
  upsertAffiliateLink(input: UpsertAffiliateLinkInput!): UpsertAffiliateLinkPayload
  createCoupon(input: CreateCouponInput!): CreateCouponPayload
}

type AuthSessionPayload {
  viewer: User
  errors: [MutationError!]!
}

type LogoutPayload {
  ok: Boolean!
  errors: [MutationError!]!
}

type AuthActionPayload {
  ok: Boolean!
  errors: [MutationError!]!
}

type MutationError {
  code: String!
  message: String!
  field: String
}

type User implements Node {
  id: ID!
  email: String!
}

type ApiToken implements Node {
  id: ID!
  label: String
  tokenPrefix: String!
  lastUsedAt: DateTime
  expiresAt: DateTime
  revokedAt: DateTime
  insertedAt: DateTime!
}

type ApiTokenConnection {
  edges: [ApiTokenEdge!]!
  pageInfo: PageInfo!
}

type ApiTokenEdge {
  node: ApiToken!
  cursor: String!
}

enum ApiTokenStatusFilter {
  ACTIVE
  REVOKED
  ALL
}

type Product implements Node {
  id: ID!
  name: String!
  slug: String!
  description: String
  brand: Brand!
  currentAttributes: [ProductAttributeValue!]!
}

type ProductAttributeValue {
  code: String!
  displayName: String!
  dataType: String!
  valueText: String!
}

type Brand implements Node {
  id: ID!
  name: String!
}

type Merchant implements Node {
  id: ID!
  name: String!
  domain: String!
}

type MerchantConnection {
  edges: [MerchantEdge!]!
  pageInfo: PageInfo!
}

type MerchantEdge {
  node: Merchant!
  cursor: String!
}

type AffiliateNetwork implements Node {
  id: ID!
  name: String!
  insertedAt: DateTime!
  updatedAt: DateTime!
}

type AffiliateProgram implements Node {
  id: ID!
  affiliateNetworkId: ID!
  merchantId: ID!
  programCode: String
  status: String
  insertedAt: DateTime!
  updatedAt: DateTime!
}

type AffiliateLink implements Node {
  id: ID!
  merchantProductId: ID!
  affiliateNetworkId: ID
  originalUrl: String!
  affiliateUrl: String!
  lastVerifiedAt: DateTime
  insertedAt: DateTime!
  updatedAt: DateTime!
}

type Coupon implements Node {
  id: ID!
  merchantId: ID!
  affiliateNetworkId: ID
  artifactId: ID
  code: String!
  description: String
  discountType: CouponDiscountType!
  discountValue: Decimal
  currency: String
  validFrom: DateTime
  validTo: DateTime
  terms: String
  insertedAt: DateTime!
  updatedAt: DateTime!
}

type SourceArtifact implements Node {
  id: ID!
  sourceKind: String!
  sourceName: String!
  sourceDomain: String
  url: String
  fetchedAt: DateTime!
}

type ActiveCoupon {
  id: ID!
  code: String!
  description: String
  discountType: CouponDiscountType!
  discountValue: Decimal
  currency: String
  validTo: DateTime
  terms: String
}

type ActiveCouponConnection {
  edges: [ActiveCouponEdge!]!
  pageInfo: PageInfo!
}

type ActiveCouponEdge {
  node: ActiveCoupon!
  cursor: String!
}

enum CouponDiscountType {
  PERCENT
  AMOUNT
  FREE_SHIPPING
  OTHER
}

type MerchantProduct implements Node {
  id: ID!
  merchantId: ID!
  productId: ID!
  externalSku: String
  url: String!
  currency: String!
  isActive: Boolean!
  merchant: Merchant
  product: Product
  latestPrice: PricePoint
  activeCoupons(first: Int, after: String, at: DateTime): ActiveCouponConnection
  priceHistory(first: Int, after: String, from: DateTime, to: DateTime): PricePointConnection
}

type PricePoint {
  id: ID!
  merchantProductId: ID!
  observedAt: DateTime!
  price: Decimal!
}

type PricePointConnection {
  edges: [PricePointEdge!]!
  pageInfo: PageInfo!
}

type PricePointEdge {
  node: PricePoint!
  cursor: String!
}

type MerchantProductConnection {
  edges: [MerchantProductEdge!]!
  pageInfo: PageInfo!
}

type MerchantProductEdge {
  node: MerchantProduct!
  cursor: String!
}

type ProductConnection {
  edges: [ProductEdge!]!
  pageInfo: PageInfo!
}

type ProductEdge {
  node: Product!
  cursor: String!
}

type SavedComparisonSetConnection {
  edges: [SavedComparisonSetEdge!]!
  pageInfo: PageInfo!
}

type SavedComparisonSetEdge {
  node: SavedComparisonSet!
  cursor: String!
}

type SavedComparisonSet implements Node {
  id: ID!
  name: String!
  items: [SavedComparisonItem!]!
}

type SavedComparisonItem {
  position: Int!
  product: Product!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input CreateSavedComparisonSetInput {
  name: String!
  productIds: [ID!]!
}

input MerchantProductsInput {
  productId: ID!
  merchantId: ID
  activeOnly: Boolean
  first: Int
  after: String
}

input UpsertAffiliateNetworkInput {
  name: String!
}

input UpsertAffiliateProgramInput {
  affiliateNetworkId: ID!
  merchantId: ID!
  programCode: String
  status: String
}

input UpsertAffiliateLinkInput {
  merchantProductId: ID!
  affiliateNetworkId: ID
  originalUrl: String!
  affiliateUrl: String!
  lastVerifiedAt: DateTime
}

input CreateCouponInput {
  merchantId: ID!
  affiliateNetworkId: ID
  artifactId: ID
  code: String!
  description: String
  discountType: CouponDiscountType!
  discountValue: Decimal
  currency: String
  validFrom: DateTime
  validTo: DateTime
  terms: String
}

input ProductNumericFilterInput {
  attributeId: ID!
  min: Decimal
  max: Decimal
}

input ProductBooleanFilterInput {
  attributeId: ID!
  value: Boolean!
}

input ProductEnumFilterInput {
  attributeId: ID!
  enumOptionId: ID!
}

input ProductFiltersInput {
  primaryTypeTaxonId: ID
  includeTypeDescendants: Boolean
  numeric: [ProductNumericFilterInput!]
  booleans: [ProductBooleanFilterInput!]
  enums: [ProductEnumFilterInput!]
  useCaseTaxonIds: [ID!]
}

input RevenueSummaryInput {
  merchantId: ID
  productId: ID
  network: String
  currency: String
  from: String
  to: String
}

type RevenueSummary {
  filters: RevenueSummaryFilters!
  metrics: RevenueSummaryMetrics!
  suppression: RevenueSummarySuppression!
}

type RevenueSummaryFilters {
  merchantId: ID
  productId: ID
  network: String
  currency: String
  from: String
  to: String
}

type RevenueSummaryMetrics {
  clicks: Int
  conversions: Int
  grossOrderValue: String
  commissionRevenue: String
  averagePaidPrice: String
  currency: String
}

type RevenueSummarySuppression {
  suppressed: Boolean!
  threshold: Int!
}

"""
Decimal values are serialized as base-10 strings to preserve precision.
"""
scalar Decimal

scalar DateTime

type CreateApiTokenPayload {
  plainTextToken: String
  apiToken: ApiToken
  errors: [MutationError!]!
}

type RevokeApiTokenPayload {
  apiToken: ApiToken
  errors: [MutationError!]!
}

type UpsertAffiliateNetworkPayload {
  network: AffiliateNetwork
  errors: [MutationError!]!
}

type UpsertAffiliateProgramPayload {
  program: AffiliateProgram
  errors: [MutationError!]!
}

type UpsertAffiliateLinkPayload {
  link: AffiliateLink
  errors: [MutationError!]!
}

type CreateCouponPayload {
  coupon: Coupon
  errors: [MutationError!]!
}

type CreateSavedComparisonSetPayload {
  savedComparisonSet: SavedComparisonSet
  errors: [MutationError!]!
}

type DeleteSavedComparisonSetPayload {
  savedComparisonSet: SavedComparisonSet
  errors: [MutationError!]!
}
